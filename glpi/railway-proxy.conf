# Railway terminates TLS at its edge and forwards plain HTTP with X-Forwarded-Proto.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Plain health path for Railway (it refuses paths with a dot such as /status.php):
# /healthz is GLPI's own unauthenticated status page, which needs the app and its database.
ProxyPass        /healthz http://127.0.0.1:${PORT}/status.php timeout=20
ProxyPassReverse /healthz http://127.0.0.1:${PORT}/status.php

# Prefork workers are held by idle keep-alive connections from Railway's edge; release them quickly.
KeepAliveTimeout 2
