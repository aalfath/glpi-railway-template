# Sized for small Railway plans; raise APACHE_MAX_WORKERS on bigger plans.
<IfModule mpm_prefork_module>
	StartServers            ${APACHE_START_SERVERS}
	MinSpareServers         1
	MaxSpareServers         ${APACHE_START_SERVERS}
	MaxRequestWorkers       ${APACHE_MAX_WORKERS}
	MaxConnectionsPerChild  1000
</IfModule>
